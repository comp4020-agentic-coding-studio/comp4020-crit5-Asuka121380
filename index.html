<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Thunder Wing</title>
    <meta
      name="description"
      content="Thunder Wing: a pointer-controlled pixel-art arcade space shooter where stopping still is how you fire."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Thunder Wing</h1>
      <div class="cabinet">
        <div class="marquee" aria-hidden="true">
          <span>THUNDER&nbsp;WING</span>
        </div>
        <div class="cabinet-body">
          <div class="side-panel side-panel--left" aria-hidden="true">
            <div class="joystick">
              <div class="joystick-base"></div>
              <div class="joystick-stick"></div>
            </div>
          </div>
          <div class="screen-stack">
            <div class="bezel">
              <div class="screen-frame">
                <canvas id="game"></canvas>
              </div>
            </div>
          </div>
          <div class="side-panel side-panel--right" aria-hidden="true">
            <div class="button-row">
              <div class="arcade-button arcade-button--red"></div>
              <div class="arcade-button arcade-button--yellow"></div>
              <div class="arcade-button arcade-button--blue"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
